about:
  dev_url: https://github.com/OlmLab/ZipStrain
  home: https://github.com/OlmLab/ZipStrain
  license: MIT
  license_family: MIT
  summary: Fast strain-level metagenomics
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . --no-deps --ignore-installed -vv
package:
  name: zipstrain
  version: 1.0.0
requirements:
  host:
  - python >=3.12
  - poetry-core
  - pip
  run:
  - python >=3.12
  - samtools
  - click
  - polars
  - plotly
  - numpy
  - seaborn
  - scipy
  - pyarrow
  - aiofiles
  - pydantic >=2,<3
  - rich
  - psutil
  - duckdb
  - pandas
  - matplotlib-base
  - h5py
  - pytorch
source:
  sha256: 1424ac24ed5816c96ca59762e22fb4ae857f4c975b3e64df975d525c9698d4a8
  url: https://pypi.io/packages/source/z/zipstrain/zipstrain-1.0.0.tar.gz
test:
  commands:
  - zipstrain --help
  - samtools --version
  - zipstrain compare --help
  - zipstrain utilities --help
  imports:
  - zipstrain
