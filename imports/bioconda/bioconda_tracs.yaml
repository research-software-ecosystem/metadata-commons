about:
  doc_url: https://github.com/gtonkinhill/tracs/tree/main/docs
  home: https://github.com/gtonkinhill/tracs
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Tracs - Fast pairwise transmission inference from single genome and/or
    metagenomic data
build:
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv'
  skip: true
extra:
  additional-platforms:
  - linux-aarch64
  - osx-arm64
package:
  name: tracs
  version: 1.1.1
requirements:
  build:
  - null
  - null
  - null
  host:
  - python
  - pip
  - setuptools
  - pybind11
  - boost-cpp
  - zlib
  - libgomp
  - llvm-openmp
  run:
  - python
  - numpy
  - pandas
  - sourmash
  - joblib
  - ncbi-genome-download
  - pyfastx
  - tqdm
  - scipy
  - plotly
  - samtools
  - htsbox
  - minimap2
  - matplotlib-base
source:
  sha256: c92881c41df50d1103064bac6bfaace43499a3331bb28c2871eb460889fa7235
  url: https://github.com/gtonkinhill/tracs/archive/v1.1.1.tar.gz
test:
  commands:
  - tracs --help
  - tracs --version
  - tracs align --help
  - tracs combine --help
  - tracs distance --help
  - tracs threshold --help
  - tracs cluster --help
  - tracs build-db --help
  - tracs pipe --help
  imports:
  - tracs
