about:
  dev_url: https://github.com/acidgenomics/py-pipette
  home: https://python.acidgenomics.com/pipette/
  license: Apache-2.0
  license_file: LICENSE
  summary: Unified import and export of data in Python.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: ' -m pip install . --no-deps --no-build-isolation -vv'
extra:
  recipe-maintainers:
  - acidgenomics
  - mjsteinbaugh
package:
  name: pipette
  version: 0.1.0
requirements:
  host:
  - python >=3.12
  - pip
  - uv-build >=0.11,<1
  run:
  - python >=3.12
  - numpy
  - pandas
source:
  sha256: 6757735e8736936efdc175687d0f4f1e24cefe46aa14a4c43979c51f9c74e222
  url: https://github.com/acidgenomics/py-pipette/archive/v0.1.0.tar.gz
test:
  imports:
  - pipette
