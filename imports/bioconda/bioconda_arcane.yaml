about:
  dev_url: https://gitlab.com/rahmannlab/arcane
  home: https://gitlab.com/rahmannlab/arcane
  license: MIT
  license_file: LICENSE
  summary: 'Arcane: Alignment-free single cell RNA-seq gene expression estimation'
build:
  entry_points:
  - arcane = arcane.arcane.arcane_main:main
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - JZentgraf
package:
  name: arcane
  version: 0.1.4
requirements:
  host:
  - python <3.14
  - setuptools >=69.0.3
  - pip
  run:
  - python <3.14
  - numpy
  - numba
  - pytest
  - jsonargparse >=4.29.0
  - pip
  - llvmlite
  - clangdev
  - xz
  - tabix
  - bzip2
  - matplotlib-base
  - seaborn
  - scipy
source:
  sha256: 187cc3912afc2faf3704210da13961f32b59118ba6b0418da4ae0115ec8f6496
  url: https://pypi.org/packages/source/s/sc-arcane/sc_arcane-0.1.4.tar.gz
test:
  commands:
  - pip check
  - arcane --help
  requires:
  - pip
  - python
