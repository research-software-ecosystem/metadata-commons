about:
  home: https://github.com/BiocPy/GenomicRanges
  license: MIT
  license_file: LICENSE.txt
  summary: Container class to represent and operate over genomic regions and annotations.
build:
  noarch: python
  number: 0
  run_exports:
  - null
  script: -m pip install . -vv --no-deps --no-build-isolation
extra:
  recipe-maintainers:
  - acidgenomics
  - mjsteinbaugh
package:
  name: genomicranges
  version: 0.8.4
requirements:
  host:
  - python
  - setuptools >=46.1.0
  - setuptools-scm >=5
  - pip
  run:
  - python
  - numpy
  - biocutils >=0.3.3
  - biocframe >=0.7.1
  - iranges >=0.7.2
  - compressed-lists >=0.4.3
source:
  sha256: 0143ef28ff4dc801a93becc9ec9fc63a4327e98ef30419245662b9067b244578
  url: https://pypi.org/packages/source/g/genomicranges/genomicranges-0.8.4.tar.gz
test:
  commands:
  - pip check
  imports:
  - genomicranges
  requires:
  - pip
